name: Build ServerDiagnostics package

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Debian package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ServerDiagnostics/ServerDiagnostics.csproj

      - name: Build
        run: dotnet build ServerDiagnostics/ServerDiagnostics.csproj --configuration Release --no-restore

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "6.x"

      - name: Calculate version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Display version
        run: |
          echo "Package version: ${{ steps.gitversion.outputs.semVer }}"

      - name: Build Debian package
        env:
          VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: |
          chmod +x ./build-deb.sh
          ./build-deb.sh

      - name: Verify package
        run: |
          ls -lh *.deb

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
          generate_release_notes: true
